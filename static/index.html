<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>תנור ושות' · Oven &amp; Co. Copilot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;800&display=swap">
  <link rel="stylesheet" href="/static/styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js" defer></script>
</head>
<body>
  <div id="login" class="modal hidden" role="dialog" aria-labelledby="login-title">
    <form id="login-form" class="card">
      <p class="kicker">OVEN &amp; CO. COPILOT</p>
      <h1 id="login-title">ברוכים הבאים לתנור 🥖</h1>
      <label>השם שלך<input id="login-name" name="name" autocomplete="username" required minlength="2" maxlength="40" placeholder="דנה"></label>
      <label>סיסמת הצוות<input id="login-password" name="password" type="password" autocomplete="current-password" required></label>
      <button type="submit" class="primary">כניסה</button>
      <p id="login-error" class="error" role="alert"></p>
    </form>
  </div>

  <div id="app" class="app hidden">
    <aside class="sidebar">
      <div class="brand">
        <span class="dot"></span>
        <div><strong>תנור ושות'</strong><small id="who"></small></div>
      </div>
      <button id="new-chat" class="primary wide">+ שיחה חדשה</button>
      <nav id="conversations" class="conversations" aria-label="Conversations"></nav>
      <div class="sidebar-foot">
        <button id="toggle-invoices" class="ghost">חשבוניות</button>
        <button id="logout" class="ghost">יציאה</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <h2 id="conv-title">שיחה חדשה</h2>
        <span id="status" class="status"></span>
      </header>

      <section id="messages" class="messages" aria-live="polite"></section>

      <form id="composer" class="composer">
        <label class="attach" title="צרפו תמונת חשבונית">
          <input id="image" type="file" accept="image/png,image/jpeg,image/webp,image/gif">
          <span>📎</span>
        </label>
        <textarea id="input" rows="1" dir="auto" placeholder="שאלו על מכירות, או צרפו חשבונית…" required></textarea>
        <button id="send" type="submit" class="primary">Send</button>
      </form>
      <p id="attachment" class="attachment hidden"></p>
    </main>

    <aside id="invoices" class="panel hidden" aria-label="Recent invoices">
      <header><h3>חשבוניות אחרונות</h3><button id="close-invoices" class="ghost">✕</button></header>
      <table>
        <thead><tr><th>תאריך</th><th>ספק</th><th>סכום</th><th>סטטוס</th></tr></thead>
        <tbody id="invoice-rows"></tbody>
      </table>
    </aside>
  </div>

  <script src="/static/app.js" defer></script>
</body>
</html>
